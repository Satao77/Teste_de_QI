<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de QI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            margin: auto;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
            font-size: 18px;
        }
        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056c7;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bem-vindo ao Teste de QI</h1>
        <p>Seu site está funcionando no Render com sucesso.</p>
        <button>Iniciar Teste</button>
    </div>
</body>
</html>
